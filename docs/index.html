<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080b"><title>Liv clips</title><link rel="stylesheet" href="styles.css?v=20261022-2"><script src="api-config.js?v=20261022-2" defer></script><script src="app.js?v=20261022-2" defer></script></head><body>
<header><strong>liv clips</strong><span id="count">loading…</span><button id="settings" aria-label="Settings">⚙</button></header>
<main id="feed" tabindex="0"><div id="stage"><div id="player"></div><div id="details"><div id="title"></div><div id="meta"></div></div></div><div id="error" role="alert"></div></main>
<div id="actions"><button data-choice="include">✓ Include</button><button data-choice="maybe">? Maybe</button><button data-choice="skip">✕ Skip</button></div>
<nav><button id="prev">↑ Previous</button><button id="next">Next ↓</button></nav>
<div id="panel" hidden><div class="panel-inner"><button id="close">✕</button><h2>Options</h2><label>Name (optional)<input id="name" placeholder="e.g. Toby" maxlength="32"></label><button id="save-name">Save</button><label>Order<select id="order"><option value="oldest">Oldest first</option><option value="newest">Newest first</option><option value="views">Most viewed</option></select></label><label><input type="checkbox" id="unreviewed"> Only unreviewed</label><label>Note for this clip<textarea id="note" rows="3" maxlength="350" placeholder="Optional"></textarea></label><button id="save-note">Save note</button><p><a id="open-twitch" target="_blank" rel="noopener">Open clip on Twitch ↗</a></p><p><a href="admin.html">Admin results ↗</a></p></div></div>
<div id="toast" role="status"></div></body></html>
